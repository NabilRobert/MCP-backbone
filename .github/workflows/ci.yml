name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # APP_DATABASE_URL (this project's own bookkeeping DB) needs an
      # account with CREATEROLE, wherever it lives: the red-team suite
      # provisions a real, throwaway Postgres role to prove the
      # database itself blocks a write, not just the app's validator.
      # The default "postgres" superuser here covers that -- don't
      # repoint this at a restricted, shared-tenant managed host, even
      # one with full read/write access, or those tests fail with
      # "permission denied to drop role". See README.md's
      # "Run it yourself" section.
      APP_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test
      APP_TARGET_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,benchmark]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Type check (pyright)
        run: .venv/bin/pyright app/ tests/ scripts/

      - name: Test (pytest)
        run: .venv/bin/pytest tests/ -v

  console:
    # The console's compiled JS is committed (the server has no Node), so
    # this checks the committed copy is exactly what its TypeScript builds to.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build tools
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc --noEmit -p .

      - name: Committed main.js matches a fresh build
        run: |
          npm run build
          git diff --exit-code -- ../app/console/static/main.js || {
            echo "::error::app/console/static/main.js is out of date. Run 'npm run build' in static-src and commit the result."
            exit 1
          }
