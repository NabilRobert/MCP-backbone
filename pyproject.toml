[project]
name = "database-mcp"
version = "0.1.0"
description = "Standalone, read-only database MCP server"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "sqlglot>=25.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "jinja2>=3.1",
    "mcp>=1.0",
    "itsdangerous>=2.2",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]
benchmark = [
    "pydantic-ai-slim[mcp,anthropic,openai]>=2.55",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# Complexity limits (the repo rules' "keep it lean"): a function stays
# simple enough to read in one go, or gets split.
extend-select = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Form()/Query() in a default argument is the
# framework's own idiomatic pattern, not the mutable-default-argument
# mistake B008 normally catches.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

[tool.pyright]
# The folders CI type-checks, so an editor (Pylance) and a bare `pyright`
# report exactly what CI does.
include = ["app", "tests", "scripts"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
